// ============================================================
// RealChinasAstronomySatellitePack RP-1 Patch - Cost / EntryCost
//
// Purpose:
//   Most RCASP parts have cost defined but entryCost is either a
//   stock placeholder (50) or incorrect. RP-1 does NOT overwrite
//   cost/entryCost for RP0conf=true parts, so we must set proper
//   entryCost values here.
//
//   entryCost set to ~5x the part cost, consistent with RP-1
//   conventions and the KIU_RP1Patch approach.
//
// Values:
//   ASO-S:                     cost=900  -> entryCost=4500
//   dark_matter_detector:      cost=650  -> entryCost=3250
//   Einstein_Probe:            cost=900  -> entryCost=4500
//   KX-08A (GECAM):            cost=900  -> entryCost=4500
//   hxmt_hard_xray_telescope:  cost=660  -> entryCost=3300
//   Taiji-1 (KX-09):           cost=900  -> entryCost=4500
//   mozi_quantum_satellite:    cost=660  -> entryCost=3300
//   smile_cas:                 cost=1000 -> entryCost=5000
//   SJ10_server:               cost=1000 -> entryCost=5000
//   SJ10_depart:               cost=100  -> entryCost=500
//   SJ10_entry:                cost=1200 -> entryCost=6000
//   SJ10_HeatShield:           cost=300  -> entryCost=1500
//   SJ10_parachute:            cost=500  -> entryCost=2500
//   xuntian (CSST):            cost=2000 -> entryCost=10000
//   xuntian_DockingPort:       cost=200  -> entryCost=1000
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - RealChinasAstronomySatellitePack
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- Science satellites (entryCost = 5x cost) ----------
// 天文/科学卫星平台: 修正 entryCost 为 5x cost
@PART[ASO-S|Einstein_Probe|KX-08A|Taiji-1]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 4500
}

@PART[dark_matter_detector]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 3250
}

@PART[hxmt_hard_xray_telescope|mozi_quantum_satellite]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 3300
}

@PART[smile_cas|SJ10_server]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 5000
}

@PART[SJ10_depart]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 500
}

// ---------- SJ10 EDL parts (entryCost = 5x cost) ----------
// 实践十号返回舱/热盾/降落伞: 修正 entryCost 为 5x cost
@PART[SJ10_entry]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 6000
}

@PART[SJ10_HeatShield]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 1500
}

@PART[SJ10_parachute]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 2500
}

// ---------- CSST (entryCost = 5x cost) ----------
// 巡天望远镜及对接端口: 修正 entryCost 为 5x cost
@PART[xuntian]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 10000
}

@PART[xuntian_DockingPort]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%entryCost = 1000
}
