// ============================================================
// RealChinasAstronomySatellitePack RP-1 Patch
// Minimal RP-1 visibility patch for the RCASP parts.
//
// Purpose:
//   RCASP parts (ASO-S, DAMPE, Einstein_Probe, GECAM, HXMT,
//   KX-09/Taiji-1, QUESS/Mozi, SMILE, SJ10 series, CSST series)
//   set RSSROConfig=True via their RO compatibility patches but
//   lack the RP0conf marker. RP-1's NonRP0.cfg therefore moves
//   them to category 99 (with FilterExtensions) or -1 (hidden,
//   with NoNonRP0 folder), making them invisible in the VAB/SPH
//   even in sandbox mode.
//
//   This patch stamps RP0conf=True on every RCASP part BEFORE the
//   zzzRP-0 pass so RP-1's cleanup logic skips them.
//
// Scope:
//   - Only marks parts as RP-1 configured. Combined with the
//     TechMapping, Cost and Tags patches, parts become visible
//     and properly placed in the RP-1 tree.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - RealChinasAstronomySatellitePack (GameData folder name)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

@PART[ASO-S|dark_matter_detector|Einstein_Probe|KX-08A|hxmt_hard_xray_telescope|Taiji-1|mozi_quantum_satellite|smile_cas|SJ10_server|SJ10_depart|SJ10_entry|SJ10_HeatShield|SJ10_parachute|xuntian|xuntian_DockingPort]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
    %RP0conf = True
}
