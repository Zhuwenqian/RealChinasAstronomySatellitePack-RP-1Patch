// ============================================================
// RealChinasAstronomySatellitePack RP-1 Patch - Tech Tree Mapping
//
// Purpose:
//   Map every RCASP part's TechRequired to historical RP-1
//   tech-tree nodes, so parts unlock at the correct year/node
//   in RP-1 career mode.
//
//   Combined with RealChinasAstronomySatellitePack_RP1Patch.cfg
//   (which sets RP0conf=True), this makes RCASP parts both
//   visible and properly placed in the RP-1 tree. Apply
//   BEFORE[zzzRP-0] so the TechRequired value is set before
//   RP-1's NonRP0 cleanup pass.
//
// Mapping logic:
//   - Reference year = real launch year of the satellite.
//   - Science satellites -> Science category (per TreeYears.csv).
//   - SJ10 EDL parts (entry/HeatShield/parachute) -> EDL category,
//     following KIU_RP1Patch's convention for heatshields and
//     parachutes (KIU places SZ/Tianwen-1 EDL parts in EDL nodes).
//
// Science node timeline (from TreeYears.csv):
//   2009-2018  advancedSurfaceScience
//   2019-2028  advModernScience
//
// EDL node timeline (from TreeYears.csv):
//   2014-2018  advancedLanding
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - RealChinasAstronomySatellitePack
//
// Parts covered: 15
// Target nodes:  3 (advancedSurfaceScience, advModernScience, advancedLanding)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- Science ----------
// advancedSurfaceScience (2009-2018) - 5 part(s)
// DAMPE 悟空 (2015), HXMT 慧眼 (2017), QUESS 墨子 (2016),
// SJ10_server 实践十号服务舱 (2016), SJ10_depart 实践十号分离器 (2016)
@PART[dark_matter_detector|hxmt_hard_xray_telescope|mozi_quantum_satellite|SJ10_server|SJ10_depart]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
    @TechRequired = advancedSurfaceScience
}

// advModernScience (2019-2028) - 7 part(s)
// ASO-S 夸父一号 (2022), Einstein_Probe 爱因斯坦探针 (2024),
// KX-08A GECAM 怀柔一号 (2020), Taiji-1 太极一号 (2019),
// SMILE (2025计划), xuntian 巡天望远镜 (2026计划),
// xuntian_DockingPort CSST对接端口 (2026计划)
@PART[ASO-S|Einstein_Probe|KX-08A|Taiji-1|smile_cas|xuntian|xuntian_DockingPort]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
    @TechRequired = advModernScience
}

// ---------- EDL ----------
// advancedLanding (2014-2018) - 3 part(s)
// SJ10_entry 返回舱 (2016, 含固体发动机), SJ10_HeatShield 热盾 (2016),
// SJ10_parachute 降落伞 (2016)
// 参考 KIU_RP1Patch: SZ/Tianwen-1 热盾与降落伞放 EDL 节点
@PART[SJ10_entry|SJ10_HeatShield|SJ10_parachute]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
    @TechRequired = advancedLanding
}
