// ============================================================
// RealChinasAstronomySatellitePack RP-1 Patch - Avionics
//
// Purpose:
//   RCASP probes carry ModuleCommand with minimumCrew = 0 but no
//   ModuleAvionics. RP-1's generic fallback (Avionics.cfg) would
//   otherwise inject ModuleAvionics with massLimit = 0, making
//   these craft uncontrollable. This patch injects ModuleAvionics
//   with a real massLimit at FOR[RP-0] (before the AFTER[RP-0]
//   fallback), so the fallback skips them.
//
// massLimit basis: real launch mass (wet) of each satellite +
//   a generous 10 t margin. Values in tonnes.
//
//   Part                    Satellite            Launch mass   massLimit
//   ASO-S                   夸父一号             888 kg  ->     10.9
//   dark_matter_detector    悟空 (DAMPE)         1850 kg ->     11.9
//   Einstein_Probe          爱因斯坦探针        1450 kg ->     11.5
//   KX-08A                  GECAM 怀柔一号*       160 kg ->     10.2
//   hxmt_hard_xray_telescope 慧眼 (HXMT)         2500 kg ->     12.5
//   Taiji-1                 太极一号             180 kg ->     10.2
//   mozi_quantum_satellite  墨子号 (QUESS)        640 kg ->     10.6
//   smile_cas               SMILE                2300 kg ->     12.3
//   SJ10_server             实践十号服务舱       3600 kg ->     13.6
//   SJ10_entry              实践十号返回舱       ~1000 kg->     11.0
//   xuntian                 CSST 巡天望远镜     16000 kg ->     26.0
//
//   * KX-08A = GECAM-A (~160 kg single satellite of the pair).
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   - RealChinasAstronomySatellitePack
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// 夸父一号 ASO-S: 888 kg 发射质量，含余量
@PART[ASO-S]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10.9
	}
}

// 悟空 DAMPE: 1850 kg
@PART[dark_matter_detector]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 11.9
	}
}

// 爱因斯坦探针: 1450 kg
@PART[Einstein_Probe]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 11.5
	}
}

// 怀柔一号 GECAM-A (KX-08A): 160 kg
@PART[KX-08A]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10.2
	}
}

// 慧眼 HXMT: 2500 kg
@PART[hxmt_hard_xray_telescope]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 12.5
	}
}

// 太极一号: 180 kg
@PART[Taiji-1]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10.2
	}
}

// 墨子号 QUESS: 640 kg
@PART[mozi_quantum_satellite]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 10.6
	}
}

// SMILE: 2300 kg
@PART[smile_cas]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
