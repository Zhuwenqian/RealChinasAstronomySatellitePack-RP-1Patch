// 实践十号服务舱（留轨舱）: 控制整星 3600 kg
@PART[SJ10_server]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 13.6
	}
}

// 实践十号返回舱: 独立再入，按返回舱单体 ~1000 kg
@PART[SJ10_entry]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 11.0
	}
}

// 巡天空间望远镜 CSST / xuntian: 16000 kg
@PART[xuntian]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:FOR[RP-0]
{
	%MODULE[ModuleAvionics]
	{
		massLimit = 26.0
	}
}