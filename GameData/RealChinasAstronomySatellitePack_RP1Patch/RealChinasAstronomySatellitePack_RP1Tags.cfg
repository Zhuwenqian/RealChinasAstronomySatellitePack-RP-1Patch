// ============================================================
// RealChinasAstronomySatellitePack RP-1 Patch - Module Tags
//
// Purpose:
//   Add RP-1 ModuleTagList tags to RCASP parts so they participate
//   in RP-1's tooling, procurement and reentry systems.
//   Applied BEFORE[zzzRP-0] so tags are present before cleanup.
//
// Scope:
//   - Science satellites (ASO-S, DAMPE, Einstein_Probe, GECAM,
//     HXMT, Taiji-1, QUESS, SMILE, SJ10_server, SJ10_depart,
//     xuntian, xuntian_DockingPort) are NOT tagged, matching
//     RP-1's own convention (RP-1's ContractSat parts do not use
//     ModuleTagList tags).
//   - SJ10 EDL parts (entry/HeatShield/parachute) ARE tagged:
//       SJ10_entry        -> Reentry + EngineSolid
//       SJ10_HeatShield   -> Reentry
//       SJ10_parachute    -> Reentry
//     This follows KIU_RP1Patch's convention for heatshields,
//     parachutes and solid-propellant EDL components.
//
// Tag assignment by part function:
//   - Heatshields, parachutes, reentry capsules -> Reentry
//   - Solid motors (SJ10_entry has SolidFuel engine) -> EngineSolid
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//   - RealChinasAstronomySatellitePack
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- Reentry ----------
// 实践十号返回舱、热盾、降落伞: 触发 RP-1 再入/EDL 逻辑
// 3 part(s)
@PART[SJ10_entry|SJ10_HeatShield|SJ10_parachute]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = Reentry }
}

// ---------- EngineSolid ----------
// 实践十号返回舱固体发动机 (SolidFuel + ModuleEnginesFX)
// 1 part(s)
@PART[SJ10_entry]:NEEDS[RP-0&RealChinasAstronomySatellitePack]:BEFORE[zzzRP-0]
{
	%MODULE[ModuleTagList] { tag = EngineSolid }
}
